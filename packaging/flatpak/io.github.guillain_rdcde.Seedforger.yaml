# Flatpak manifest skeleton for the cross-platform Avalonia GUI.
# Ships the self-contained single-file GUI binary from the release. Update the
# `url`/`sha256` for the linux-x64 GUI artifact when cutting a release, then build:
#   flatpak-builder build-dir io.github.guillain_rdcde.Seedforger.yaml --install --user
app-id: io.github.guillain_rdcde.Seedforger
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: seedforger-gui
finish-args:
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --device=dri
modules:
  - name: seedforger
    buildsystem: simple
    build-commands:
      - install -Dm755 Seedforger-gui-linux-x64 /app/bin/seedforger-gui
      - install -Dm644 io.github.guillain_rdcde.Seedforger.metainfo.xml /app/share/metainfo/io.github.guillain_rdcde.Seedforger.metainfo.xml
    sources:
      - type: file
        path: io.github.guillain_rdcde.Seedforger.metainfo.xml
      - type: file
        url: https://github.com/Guillain-RDCDE/Seedforger/releases/download/v2.19.0/Seedforger-gui-linux-x64
        sha256: 'aad8dfe2a49471246a3b9475eb6f2ca114c4ed164ac47f6a8f4213c01b040b11'
