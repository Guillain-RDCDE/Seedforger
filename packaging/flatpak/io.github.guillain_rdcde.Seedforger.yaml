# Flatpak manifest for the cross-platform Avalonia GUI.
# Ships the self-contained single-file GUI binary from the release. Update the
# `url`/`sha256` of both linux GUI artifacts when cutting a release, then build:
#   flatpak-builder --user --install-deps-from=flathub --install build-dir io.github.guillain_rdcde.Seedforger.yaml
# CI builds this manifest as committed, and once more with a GUI built from the
# checkout, and opens the window from the installed bundle (.github/workflows/ci.yml).
app-id: io.github.guillain_rdcde.Seedforger
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: seedforger-gui
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --device=dri
  # .torrent files usually sit in Downloads; the file picker goes through the portal anyway.
  - --filesystem=xdg-download:ro
modules:
  - name: seedforger
    buildsystem: simple
    build-commands:
      - install -Dm755 Seedforger-gui-linux-* /app/lib/seedforger/Seedforger.App
      # The single-file binary unpacks its native libraries (SkiaSharp, HarfBuzz) on
      # first start; inside the sandbox the default ~/.net is not writable.
      - |
        cat > seedforger-gui <<'EOF'
        #!/bin/sh
        export DOTNET_BUNDLE_EXTRACT_BASE_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/dotnet-bundle"
        exec /app/lib/seedforger/Seedforger.App "$@"
        EOF
      - install -Dm755 seedforger-gui /app/bin/seedforger-gui
      - install -Dm644 io.github.guillain_rdcde.Seedforger.desktop /app/share/applications/io.github.guillain_rdcde.Seedforger.desktop
      - install -Dm644 io.github.guillain_rdcde.Seedforger.png /app/share/icons/hicolor/256x256/apps/io.github.guillain_rdcde.Seedforger.png
      - install -Dm644 io.github.guillain_rdcde.Seedforger.metainfo.xml /app/share/metainfo/io.github.guillain_rdcde.Seedforger.metainfo.xml
    sources:
      - type: file
        path: io.github.guillain_rdcde.Seedforger.desktop
      - type: file
        path: io.github.guillain_rdcde.Seedforger.png
      - type: file
        path: io.github.guillain_rdcde.Seedforger.metainfo.xml
      - type: file
        only-arches: [x86_64]
        url: https://github.com/Guillain-RDCDE/Seedforger/releases/download/v3.0.1/Seedforger-gui-linux-x64
        sha256: 'af8e593bafecacede24fec3cd8f92cfc986b5b8b289fbbc8a5508efc4561457f'
      - type: file
        only-arches: [aarch64]
        url: https://github.com/Guillain-RDCDE/Seedforger/releases/download/v3.0.1/Seedforger-gui-linux-arm64
        sha256: 'df7476bd8dd49eb3739cc05da420c5db495a449871fcccb1e5a61ac7b8f65a82'
