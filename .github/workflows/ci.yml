name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Seedforger.sln

      # Compiler and analyzer warnings fail the build; NuGet vulnerability
      # advisories (NU1901-NU1904) stay warnings so an upstream advisory alone
      # doesn't block CI (Dependabot proposes the bump).
      - name: Build (warnings as errors)
        run: dotnet build Seedforger.sln -c Release --no-restore -p:TreatWarningsAsErrors=true -p:WarningsNotAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904

      - name: Test
        run: dotnet test tests/Seedforger.Tests/Seedforger.Tests.csproj -c Release --no-build

  # The engine core + headless CLI are WinForms-free, so they build and the whole
  # test suite runs on Linux — this is the cross-platform guarantee.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build core + CLI + Avalonia GUI + Integrity (warnings as errors)
        run: |
          WAE="-p:TreatWarningsAsErrors=true -p:WarningsNotAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904"
          dotnet build src/Seedforger.Core/Seedforger.Core.csproj -c Release $WAE
          dotnet build src/Seedforger.Cli/Seedforger.Cli.csproj -c Release $WAE
          dotnet build src/Seedforger.App/Seedforger.App.csproj -c Release $WAE
          dotnet build src/Seedforger.Integrity/Seedforger.Integrity.csproj -c Release $WAE
          dotnet build src/Seedforger.Integrity.Figures/Seedforger.Integrity.Figures.csproj -c Release $WAE

      - name: Test on Linux
        run: dotnet test tests/Seedforger.Tests/Seedforger.Tests.csproj -c Release

      # The science annex (docs/papers) quotes figures/metrics.json. Regenerate it from
      # the model so a code change that would move the numbers can't ship with stale prose.
      # We check the metrics land in the expected ranges rather than byte-diffing the SVGs,
      # since transcendental functions can differ by an ULP across platforms; the xUnit
      # suite already pins the science with tolerances.
      - name: Regenerate + validate science-annex figures
        run: |
          set -euo pipefail
          rm -rf /tmp/figs && mkdir -p /tmp/figs
          dotnet run --project src/Seedforger.Integrity.Figures/Seedforger.Integrity.Figures.csproj -c Release -- /tmp/figs
          for f in fig1-invariants fig2-roc fig3-breakdown fig4-plateau fig5-boundary; do
            test -s "/tmp/figs/$f.svg" || { echo "::error::missing figure $f.svg"; exit 1; }
            python3 -c "import xml.dom.minidom,sys; xml.dom.minidom.parse('/tmp/figs/$f.svg')"
          done
          python3 - <<'PY'
          import json
          m = json.load(open("/tmp/figs/metrics.json"))
          def chk(k, lo, hi):
              v = m[k]
              assert lo <= v <= hi, f"{k}={v} outside [{lo},{hi}]"
              print(f"  {k} = {v}  ok")
          chk("auc_careful", 0.98, 1.0)
          chk("auc_naive", 0.98, 1.0)
          chk("auc_established_c002", 0.95, 1.0)
          chk("auc_fresh_c002", 0.6, 0.95)          # the characterised weak spot
          chk("mass_alarm_healthy", 0.0, 0.02)
          chk("mass_alarm_cheated", 0.05, 0.5)
          chk("breakdown_mean_at_040", 3.0, 8.0)     # mean is dragged away
          chk("breakdown_huber_at_040", 0.8, 1.8)    # Huber holds near 1.0
          chk("game_credit_multiplier", 1.25, 1.25)  # 1/(1-0.2), exact
          chk("game_free_ratio_at_zero_work", 0.0, 0.0)
          assert m["auc_established_c002"] > m["auc_fresh_c002"], "coverage/freshness ordering broken"
          print("science-annex metrics validated")
          PY

      - name: Publish self-contained Linux CLI
        run: dotnet publish src/Seedforger.Cli/Seedforger.Cli.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o publish/cli-linux

      - name: Smoke-test the CLI binary
        run: |
          chmod +x publish/cli-linux/Seedforger.Cli
          ./publish/cli-linux/Seedforger.Cli --list-clients | head -5
          ./publish/cli-linux/Seedforger.Cli --help | head -3

      # End-to-end against a real local tracker: a Python mock tracker replies with a
      # bencoded swarm, the CLI dry-run must be accepted, and the daemon must serve a
      # live dashboard whose JSON reflects the reported figures. Exercises the shipped
      # binary, not just the library (the in-process wire tests run in the test step).
      - name: E2E — CLI + daemon against a mock tracker
        run: |
          set -euo pipefail
          BIN=./publish/cli-linux/Seedforger.Cli
          python3 tools/mock_tracker.py make-torrent /tmp/sample.torrent http://127.0.0.1:8071/announce
          python3 tools/mock_tracker.py serve --port 8071 --complete 9 --incomplete 6 --interval 5 &
          TRACKER=$!
          sleep 1

          echo "== dry-run announce =="
          "$BIN" --test-announce -t /tmp/sample.torrent --client qBittorrent | tee /tmp/dry.txt
          grep -q "accepted as a seeder" /tmp/dry.txt
          grep -q "seeders (complete):    9" /tmp/dry.txt

          echo "== daemon + dashboard =="
          "$BIN" -t /tmp/sample.torrent --daemon --web-port 8091 -u 200 --realistic off --duration 1 &
          DAEMON=$!
          sleep 4
          curl -sf http://127.0.0.1:8091/api/status -o /tmp/status.json
          cat /tmp/status.json; echo
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/status.json"))
          assert d["app"] == "Seedforger", d
          assert d["totals"]["count"] == 1, d
          t = d["torrents"][0]
          assert t["seeders"] == 9 and t["leechers"] == 6, t
          assert t["uploaded"] > 0, t
          assert t["client"].startswith("qBittorrent"), t
          print("dashboard JSON OK:", t["name"], t["uploaded"], "bytes,", t["seeders"], "seeders")
          PY
          curl -sf http://127.0.0.1:8091/ | grep -q "Seedforger"

          kill $DAEMON $TRACKER 2>/dev/null || true

  # Builds the Flatpak from packaging/flatpak, installs the bundle, opens the
  # window under Xvfb and checks a setting survives a restart. "manifest" builds the file exactly as committed (the released
  # binary, checksum-verified); "main" swaps in a GUI published from this checkout,
  # so a change that would break the Flatpak shows up before a tag, not after.
  flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [manifest, main]
    env:
      APP_ID: io.github.guillain_rdcde.Seedforger
    steps:
      - uses: actions/checkout@v7

      - name: Flatpak tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder xvfb xdotool > /dev/null
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - uses: actions/setup-dotnet@v6
        if: matrix.variant == 'main'
        with:
          dotnet-version: '10.0.x'

      - name: Point the manifest at a GUI built from this checkout
        if: matrix.variant == 'main'
        run: |
          set -euo pipefail
          dotnet publish src/Seedforger.App/Seedforger.App.csproj -c Release -r linux-x64 \
            --self-contained true -p:PublishSingleFile=true -o out/gui
          cp out/gui/Seedforger.App packaging/flatpak/Seedforger-gui-linux-x64
          python3 - <<'PY'
          import re
          p = "packaging/flatpak/io.github.guillain_rdcde.Seedforger.yaml"
          s = open(p, encoding="utf-8").read()
          s, n = re.subn(r"url: \S+/Seedforger-gui-linux-x64\n(\s+)sha256: '[0-9a-f]{64}'",
                         r"path: Seedforger-gui-linux-x64", s)
          assert n == 1, "linux-x64 GUI source not found in the manifest"
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Build the Flatpak and its bundle
        run: |
          set -euo pipefail
          cd packaging/flatpak
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --repo="$RUNNER_TEMP/repo" --force-clean "$RUNNER_TEMP/build" "$APP_ID.yaml"
          flatpak build-bundle "$RUNNER_TEMP/repo" "$GITHUB_WORKSPACE/seedforger.flatpak" "$APP_ID"
          flatpak install --user -y --noninteractive "$GITHUB_WORKSPACE/seedforger.flatpak"
          flatpak info --user "$APP_ID"
          ls -la "$GITHUB_WORKSPACE/seedforger.flatpak"

      - name: Open the window from the installed Flatpak
        run: |
          set -uo pipefail
          Xvfb :99 -screen 0 1280x900x24 > /dev/null 2>&1 &
          export DISPLAY=:99
          sleep 2
          flatpak run --user "$APP_ID" > app.log 2>&1 &
          APP=$!
          WID=
          for i in $(seq 1 60); do
            WID=$(xdotool search --onlyvisible --name 'Seedforger' 2>/dev/null | head -1 || true)
            [ -n "$WID" ] && break
            kill -0 $APP 2>/dev/null || break
            sleep 1
          done
          echo "window: ${WID:-none} ($(xdotool getwindowname "$WID" 2>/dev/null || true))"
          kill $APP 2>/dev/null || true
          flatpak kill "$APP_ID" 2>/dev/null || true
          tail -n 40 app.log || true
          [ -n "$WID" ] || { echo "::error::the Flatpak did not open a Seedforger window"; exit 1; }

      # /app is read-only, so settings.json must land in the sandbox's config folder
      # and come back on the next launch. Each run toggles Settings > Realistic speed
      # from the keyboard (Alt opens the menu bar; Settings is the fourth menu and the
      # toggle its first item): the second run turns it back on only if it read what
      # the first run saved. The manifest variant is the released binary; it runs the
      # same check for comparison but cannot fail the job while that release predates
      # the per-user settings folder.
      - name: A setting saved in one run is read back in the next; the samples are created
        continue-on-error: ${{ matrix.variant == 'manifest' }}
        run: |
          set -euo pipefail
          Xvfb :98 -screen 0 1280x900x24 > /dev/null 2>&1 &
          export DISPLAY=:98
          sleep 2
          CFG="$HOME/.var/app/$APP_ID/config/seedforger/settings.json"
          rm -f "$CFG"
          toggle_realistic() {
            flatpak run --user "$APP_ID" > "settings-run$1.log" 2>&1 &
            local app=$! wid=
            for i in $(seq 1 60); do
              wid=$(xdotool search --onlyvisible --name 'Seedforger' 2>/dev/null | head -1 || true)
              [ -n "$wid" ] && break
              sleep 1
            done
            [ -n "$wid" ] || { echo "::error::run $1: no window"; tail -n 40 "settings-run$1.log"; return 1; }
            sleep 3
            xdotool mousemove --window "$wid" 400 300
            xdotool windowfocus "$wid" 2>/dev/null || true
            sleep 1
            for k in alt Right Right Right Down Return; do
              xdotool key --clearmodifiers "$k"
              sleep 0.5
            done
            sleep 2
            kill "$app" 2>/dev/null || true
            flatpak kill "$APP_ID" 2>/dev/null || true
            wait "$app" 2>/dev/null || true
            tail -n 20 "settings-run$1.log" || true
          }
          realistic() { python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["RealisticSpeed"])' "$CFG"; }

          toggle_realistic 1
          if [ ! -s "$CFG" ]; then
            echo "::error::run 1 left no settings.json in the sandbox config folder"
            find "$HOME/.var/app/$APP_ID" -maxdepth 3 || true
            exit 1
          fi
          cat "$CFG"
          [ "$(realistic)" = "False" ] || { echo "::error::run 1 did not save Realistic speed = off"; exit 1; }

          toggle_realistic 2
          cat "$CFG"
          [ "$(realistic)" = "True" ] || { echo "::error::run 2 did not start from the settings run 1 saved"; exit 1; }
          echo "settings persisted across two sandboxed runs in $CFG"

          # The read-only /app cannot take the sample files either: they belong next
          # to settings.json, and must be valid JSON.
          for f in clients.sample.json campaign.sample.json; do
            P="$(dirname "$CFG")/$f"
            test -s "$P" || { echo "::error::$f was not created in the sandbox config folder"; exit 1; }
            python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$P"
            echo "$f created in the sandbox ($(stat -c %s "$P") bytes)"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-${{ matrix.variant }}
          path: seedforger.flatpak
